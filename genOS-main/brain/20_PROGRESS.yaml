# Known bugs or risks
known_issues:
  - "Open, ask the human at the start of a session until settled: the five old rep sounds (Assets/TheraQuest: Perfect, great, Awesome, miss, victory .mp3) have no known source (CREDITS.md \"Not yet recorded\"). Fine while the repository stays private (DEC-020), but before any commercial release either the human names the source (if made with an AI tool: which tool and plan, since its terms decide commercial use; labelling them AI-generated is only right if true) or the agent replaces them with CC0 sounds (Kenney). Raised 2026-10-28."
  - "The Unity project renders with the Built-in render pipeline (no URP asset is assigned in Graphics or Quality settings), although 00_PROJECT.md lists URP. The Little Guys coach material is URP, so HumanoidCoach swaps it for a plain Built-in Standard material at runtime; if URP is switched on later, that swap stops and the pack's own material is used. Found 2026-10-27."
  - "Single-camera tracking requires specific camera placement (sagittal vs frontal) per exercise."
  - "Patient codes (P-001...) are guessable pseudonyms; VR routes are safe only because they are loopback-only. A remote VR client would need a per-device secret (see ClinicalBackend Future Changes)."
  - "Extension exercises (shoulderExt, hipExt) have no reading when the tracker can't tell which way the patient faces (signed angle -999); flexion exercises fall back to the unsigned angle. Measured in the unscheduled hardware milestone HW (HW.3)."
  - "Live webcam reconnect (M4.4) and the headset path are untested on hardware (no headset available; this PC has no OpenXR runtime installed). Both are part of the unscheduled hardware milestone HW (HW.2, HW.3)."
  - "First-person view (M5.8, DEC-021): the live limb shows one tracker angle on a fixed default body, so it can't show a limb moving out of the exercise's plane, and its length won't match the patient's real limb. Lying and side-lying legs run away from the eye and are the hardest to read. Default height calibration, the lying head direction and the lying panel position have only been unit tested or written, never run in a headset (HW.2). Found 2026-11-01."
  - "Tracking safeguards (M5.9, DEC-022): every threshold in tracker/tracking.py is an untuned starting value; real webcam testing is in HW.3. The only live webcam run (2026-11-01) showed MediaPipe being restarted for a person with legs out of frame (fixed: it now needs no verified joint at all), and two more restarts about 22 s apart afterwards whose cause is unknown (possibly nobody in view). Check in HW.3."

