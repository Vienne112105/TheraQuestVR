pending_human_tests:
  - "M5.1 dashboard walkthrough in the desktop app: double-click Start_Therapist_App.bat (it starts the server and opens the TheraQuest window). Using the keyboard only (Tab, Shift+Tab, Enter, Escape, arrow keys on the chart tabs), sign in, open a chart, switch tabs, and open and close every dialog; focus should go back to the button you came from. Shrink the window to its smallest size and check nothing scrolls sideways. Open a patient with more than 50 sessions and use Show older sessions. Report anything that looks wrong or worse than before."
  - "M5.2 check in the desktop app (Start_Therapist_App.bat): open a test patient, use Edit Details to change the name or condition, then Archive them (they disappear from the caseload; tick Show archived patients to see them again) and Reactivate. In the Protocol Library, create a protocol of your own, open it, use Edit on a phase and Add Phase. Open a built-in protocol and check it says read-only and has no Edit buttons. Report anything wrong."
  - "M5.7 check in the desktop app: open the Protocol Library and read through the seven new protocols (ACL reconstruction, Total knee replacement (MGB), Hip fracture fixation, Ankle fracture ORIF, Distal radius fracture ORIF, Tibial plateau fracture ORIF, Lateral ankle sprain). Check phases, timelines and precautions read correctly against the sources, and apply one to a test patient. The angles and reps are starting points for a licensed PT to confirm (TASK-007)."
  - "M5.3 check in the desktop app: the caseload should list patients that need attention first, with red chips (Unsafe reps, Pain rising, Accuracy dropping, Missed sessions); hover a chip for the reason. Open a flagged patient and read the Needs attention notice and the Clinical Status box. Say whether the reasons make clinical sense; the thresholds are placeholders for a PT to set (TASK-007)."
  - "M5.4 Play-mode check (Unity Editor, or the built player with -patient): start a session; on the laptop the camera eases in to frame the coach at each exercise (closer for small moves, tilted down for table exercises; in a headset it only re-centers); each exercise shows an Exercise N of M get-ready card, then 3-2-1-Go after pressing Start; finishing an exercise shows EXERCISE COMPLETE and Up next for a few seconds; pause (Esc / B) and choose Restart this exercise, which starts again from set 1; the hints say Space / Esc on the laptop (A / B in a headset); with an unsent offline session the main menu says it is waiting to be sent."
  - "M5.5 Play-mode check (with the clinical server running): main menu > Your progress shows level, streak, badges (earned gold, locked grey) and recent sessions; finish a session and check the summary stays short (good reps, points, saved), the XP bar fills (and rolls over with LEVEL UP when a level is reached), and new badges appear one by one; repeat with the server stopped: the summary says the XP is added when sent, and Your progress says it is the last saved progress."
  - "M5.6 Play-mode check (Unity Editor or built player), with headphones at a normal volume: menu, HUD, summary and Your progress text is sharp and readable (now TextMeshPro; symbols like ★ ✓ ▶ show), panels use only the five palette colours (red only on STOP and unsafe warnings), big titles and numbers have outlines (navy text a light one, pop-ups a darker one), the main menu shows a tilted VR headset logo after TheraQuest, Your progress has Profile / Recent sessions / Badges tabs (Left / Right or click) with one card per badge, both coaches are the Little Guys characters (DEC-018) with toon shading and coloured outlines, their own colours showing, and breathe in a natural idle, the coach stands in the middle of its mat stands upright on a blue yoga mat a little further back, gestures while it speaks, and for seated or lying exercises sits on its chair or lies on the mat (no bed) already during the get-ready card, the room shows real gym equipment and furniture models (nothing blocks the coach or the HUD), and no card has empty space at the bottom; badge icons are gold when earned and grey when locked on the HUD Badges row, the summary (New badge) and Your progress; the lo-fi music plays and moves to another track when one ends, and Settings > Music changes its volume; holding a target plays the new hold-complete chime, a new badge plays the chime with reverb, and click, STOP and level up sound as before; the coach stands with a natural idle (breathing, small shifts) before and between exercises, keeps its own body shape, has its shoes on top of the mat (and lies fully on it), blinks, smiles and moves its mouth while it speaks; the room has no models with floating parts (rowing machine, weight plates and dumbbells, sofa, glass mirror). Also tell the agent where the old rep sounds (Perfect, Great, Awesome, Miss, Victory) came from, for CREDITS.md (the older coach models are no longer used, so their source matters only if they stay in the project)."

# Known bugs or risks
known_issues:
  - "The Unity project renders with the Built-in render pipeline (no URP asset is assigned in Graphics or Quality settings), although 00_PROJECT.md lists URP. The Little Guys coach material is URP, so HumanoidCoach swaps it for a plain Built-in Standard material at runtime; if URP is switched on later, that swap stops and the pack's own material is used. Found 2026-10-27."
  - "Single-camera tracking requires specific camera placement (sagittal vs frontal) per exercise."
  - "Patient codes (P-001...) are guessable pseudonyms; VR routes are safe only because they are loopback-only. A remote VR client would need a per-device secret (see ClinicalBackend Future Changes)."
  - "Extension exercises (shoulderExt, hipExt) have no reading when the tracker can't tell which way the patient faces (signed angle -999); flexion exercises fall back to the unsigned angle. Measured in the unscheduled hardware milestone HW (HW.3)."
  - "Live webcam reconnect (M4.4) and the headset path are untested on hardware (no headset available; this PC has no OpenXR runtime installed). Both are part of the unscheduled hardware milestone HW (HW.2, HW.3)."

