pending_human_tests:
  - "M10.5 Patient Lock (2026-11-26): start tracker.py and a webcam session with the patient exercising. (1) A second person walks in and stands beside, then behind the patient: the session must not pause. (2) The patient steps out and the second person stands in the patient's place and exercises: after about 1 s the game shows Only the patient can do the exercise, and no reps are counted. (3) The second person leaves and the patient comes back: counting resumes, earlier reps kept. (4) The dashboard session row says Paused n times for another person. Note any false pause of the patient alone. Approve, or say what to change."
  - "M8.3 Feedback Motion (2026-11-24): in Play mode check each moment. (1) Menu: opens, closes and changes page with a short fade, never sluggish. (2) Good rep: a small orange glow burst where the limb reached the target, the points tile bounces; after 2 or more good reps in a row the COMBO tile pulses. (3) Hold exercise: a ring round the target star fills while you hold, and a sparkle pops when the hold completes. (4) Missed rep, posture fault and STOP (past the safe limit): the red or orange warning shows at once, with no burst, bounce or sparkle. (5) Summary fades in; on a level-up a sparkle behind the level pill, and one behind the badge row per new badge (needs a webcam session that counts). (6) Hold bar, SMOOTH/SLOW DOWN pill and NEXT row fade in and out. Nothing moves the view; nothing feels distracting in the headset. Approve, or say what to change."
  - "M8.5 Menus & Summary Polish (2026-11-24): in Play mode open every menu page (main, Pause, Settings, Therapist PIN, Therapist, Progress: Profile, Recent sessions, Badges) and finish one session to see the summary. Check with the mouse (hover tint, press), the keyboard (arrow choice, Enter flash) and, if the headset is on, the controller rays; check nothing is cut off and the summary reads title, stars, points, details. Then approve or list changes; M8.5 is marked done only after the approval."
  - "M8.7 Dashboard Hidden Data (2026-11-24): open the rebuilt Therapist app, open a patient chart and check the Activity tab: the 14-day adherence calendar, Exercise Results table and Phase History timeline read clearly with your real data, and look right at the smallest window size. Approve, or say what to change."
