# Known bugs or risks
known_issues:
  - "Single-camera tracking requires specific camera placement (sagittal vs frontal) per exercise."
  - "Patient codes (P-001...) are guessable pseudonyms; VR routes are safe only because they are loopback-only. A remote VR client would need a per-device secret (see ClinicalBackend Future Changes)."
  - "Extension exercises (shoulderExt, hipExt) have no reading when the tracker can't tell which way the patient faces (signed angle -999); flexion exercises fall back to the unsigned angle. Measured by pending_human_tests Check 3."
  - "Live webcam reconnect (M4.4) and the headset path are untested on hardware; this PC has no OpenXR runtime installed, so the batch player run only proved the desktop fallback."

