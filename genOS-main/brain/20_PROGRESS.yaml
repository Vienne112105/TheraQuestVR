session_summary: "2026-10-27: M5 Dashboard & Game Experience is active; every child (M5.1-M5.7) is built and TBF, waiting on the human checks in pending_human_tests. M5.6 (assets) done: Kenney/OpenGameArt CC0 sounds, lo-fi playlist, badge icons, TextMeshPro, five-colour palette (DEC-016), and coaches = Little Guys - Free Sample (DEC-018; the cartoon toon style DEC-017 was tried and removed at the human's request). Latest (human requests 2026-10-27): old Quaternius coach models deleted; Little Guys get upright T-pose avatars (Resources/CoachAvatars, TheraQuest > Build Coach T-Pose Avatars) so the CC0 idles play without a hunch and with open hands; a CC0 talking idle plays while the coach speaks; the coach stands 0.6 m further back on a runtime-built blue yoga mat; lying and side-lying exercises are on the mat (no bed anywhere). Agent play-tested standing, seated, lying and side-lying in the Editor with simulated input and a throwaway server; offline queue and program cache backed up and restored. TheraQuest.unity has the human's own uncommitted changes; left alone. Then (TASK-014, DEC-019): room decorations are 3D models (Low Poly Gym Pack by reodesuxz, Kenney Furniture Kit CC0) and the seated-exercise chair is a Kenney model; Unity EditMode tests 52 pass. 2026-10-28 (human requests): coach keeps its model's own body shape (clips move only the arms), soles and lying body rest on top of the mat (measured from the posed mesh), face blinks / smiles / talks (blend shapes scaled to the Little Guys' 0-1 weights; 0-100 had blown the face apart), unfinished-looking room models swapped (bike, kettlebells, benches) and mirror given a glass look; measured in Play mode on both coaches and all four postures; tests 52 pass. Next: the human runs the pending checks; then M5 can close (or HW gets scheduled)."
